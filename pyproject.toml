[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-pregame"
version = "0.1.0"
description = "Start your Claude 5-hour usage window before you start working."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["claude", "claude-code", "anthropic", "usage-limit", "productivity"]
classifiers = [
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/Haasha/claude-pregame"

[project.scripts]
pregame = "pregame:main"

[tool.setuptools]
py-modules = ["pregame"]
